
name: JB Premium Hub - Billing Alert Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-test:
    name: Test GitHub Failure Notification
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Confirm isolated test
        run: |
          echo "JB Premium Hub billing alert test"
          echo "Environment: SIMULATED"
          echo "Real payments: NONE"
          echo "Database changes: NONE"
          echo "External payment API calls: NONE"

      - name: Simulate monitoring failure
        run: |
          echo "::error::SIMULATED_BILLING_ALERT_TEST"
          echo "This is an intentional test failure."
          echo "No real billing problem has been detected."
          exit 1
