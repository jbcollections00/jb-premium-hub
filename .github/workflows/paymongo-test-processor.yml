name: PayMongo TEST Webhook Processor

on:
  schedule:
    # UTC; GitHub scheduled runs can be delayed or dropped.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run checks GitHub Actions only; process invokes the TEST processor'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - process

permissions:
  contents: read

concurrency:
  group: jb-paymongo-test-webhook-processor
  cancel-in-progress: false

jobs:
  manual-dry-run:
    name: Manual dry-run (no payment API call)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm safe dry-run
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS: Manual dry-run executed.'
          echo 'No token retrieved; no request sent to Supabase or PayMongo.'
          echo 'No payment or membership operations performed.'

  process-one-test-webhook:
    name: Invoke private TEST processor
    if: ${{ vars.JB_TEST_SCHEDULER_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'process')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PROCESSOR_TOKEN: ${{ secrets.JB_TEST_WEBHOOK_PROCESSOR_TOKEN }}
      PROCESSOR_URL: https://kwazrebdlzdkwdhrintr.supabase.co/functions/v1/jb-paymongo-webhook-processor-test
    steps:
      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${#PROCESSOR_TOKEN} -lt 32 ]]; then
            echo 'TEST worker secret missing or too short; refusing invocation.' >&2
            exit 1
          fi
      - name: Invoke TEST processor (one event per run)
        shell: bash
        run: |
          set -euo pipefail
          # Never enable shell tracing or print token / response body.
          status="$(curl --silent --show-error \
            --connect-timeout 8 --max-time 35 \
            --retry 0 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${PROCESSOR_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"confirm":"process-one-test-webhook"}' \
            "${PROCESSOR_URL}")"
          echo "TEST processor HTTP status: ${status}"
          if [[ "${status}" != '200' ]]; then
            echo 'TEST processor did not confirm success; review Supabase Edge Function logs.' >&2
            exit 1
          fi
