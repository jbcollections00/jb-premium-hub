name: JB PayMongo Subscribe UI Review (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/components/layout/ProtectedRoute.jsx'
      - 'src/pages/public/Login.jsx'
      - 'src/pages/public/Home.jsx'
      - 'src/components/layout/MainLayout.jsx'
      - 'src/components/VIPVideoPlayer.jsx'
      - 'src/services/billingAccess.js'
      - 'src/pages/public/Subscribe.jsx'
      - 'src/pages/public/BuyVip.jsx'
      - 'src/pages/public/Profile.jsx'
      - 'package-lock.json'
      - '.github/workflows/jb-subscribe-ui-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-subscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check route and default-off checkout
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const app = readFileSync('src/App.jsx', 'utf8');
          const page = readFileSync('src/pages/public/Subscribe.jsx', 'utf8');
          assert.match(app, /path="\/subscribe" element=\{<Subscribe \/>\}/);
          assert.match(page, /VITE_JB_LIVE_CHECKOUT_UI_ENABLED === 'true'/);
          // LIVE button must not be shown to non-tester accounts during controlled rollout.
          assert.match(page, /VITE_JB_LIVE_CHECKOUT_UI_MODE/);
          assert.match(page, /VITE_JB_LIVE_CHECKOUT_TESTER_USER_ID/);
          assert.match(page, /CHECKOUT_UI_MODE === 'tester'/);
          assert.match(page, /user\?\.id\?\.toLowerCase\(\) === TESTER_UI_USER_ID/);
          assert.match(page, /CHECKOUT_UI_MODE === 'public'/);
          assert.match(page, /params\.get\('checkout_debug'\) === '1'/);
          assert.match(page, /Read-only checkout diagnostics/);
          assert.match(page, /Valid tester UUID configured/);
          assert.match(page, /Signed-in account matches tester/);
          assert.match(page, /const SITE_ORIGIN = 'https:\/\/www\.jb-premium-hub\.vip'/);
          assert.match(page, /window\.location\.origin === SITE_ORIGIN/);
          assert.match(page, /disabled=\{!checkoutUiEnabled/);
          assert.match(page, /jb_billing_my_access/);
          assert.match(page, /function formatEntitlement\(raw\)/);
          assert.match(page, /entitlement\.canDownload/);
          assert.match(page, /entitlement\.expiry/);
          assert.doesNotMatch(page, /JSON\.stringify\(access, null, 2\)/);
          assert.match(page, /jb-paymongo-checkout-live/);
          // Ensure TEST checkout is opt-in and isolated from LIVE.
          assert.match(page, /VITE_JB_TEST_CHECKOUT_UI_ENABLED === 'true'/);
          assert.match(page, /jb-billing-checkout-test/);
          assert.match(page, /if \(!testCheckoutUiEnabled \|\| busy \|\| !user\) return;/);
          assert.match(page, /data\?\.environment !== 'test'/);
          assert.match(page, /outcome === 'test-return'/);
          assert.match(page, /outcome === 'test-cancel'/);
          // The old manual payment page must no longer accept receipt uploads.
          const legacy = readFileSync('src/pages/public/BuyVip.jsx', 'utf8');
          const profile = readFileSync('src/pages/public/Profile.jsx', 'utf8');
          assert.match(legacy, /<Navigate to=\{/);
          assert.match(legacy, /\/subscribe/);
          assert.doesNotMatch(legacy, /support_tickets|Ownbank_QR|handleSubmitPayment/);
          assert.match(profile, /navigate\(\s*"\/subscribe"/);
          const guard = readFileSync('src/components/layout/ProtectedRoute.jsx', 'utf8');
          const login = readFileSync('src/pages/public/Login.jsx', 'utf8');
          assert.match(guard, /state=\{\{ from: location\.pathname/);
          assert.match(login, /location\.state\?\.from/);
          assert.match(login, /navigate\(safeDestination, \{ replace: true \}\)/);
          console.log('Subscription route, fail-closed checkout, and return-after-login verified');
          NODE
      - name: Verify entitlement resolver behavior (NO NETWORK)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const code = readFileSync('src/services/billingAccess.js','utf8');
          const start = code.indexOf('export function normalizeBillingAccess');
          const end = code.indexOf('export async function getBillingAccess');
          const fragment = code.slice(start,end).replace('export function','function');
          const second = code.slice(code.indexOf('export function getLegacyPrivileges')).replaceAll('export function','function');
          const testModule = 'data:text/javascript,' + encodeURIComponent(fragment + second + '\nexport {normalizeBillingAccess, resolveMemberPresentation};');
          const {normalizeBillingAccess, resolveMemberPresentation} = await import(testModule);
          const future = new Date(Date.now()+86400000).toISOString();
          const past = new Date(Date.now()-86400000).toISOString();
          const free = normalizeBillingAccess([{tier:'free',can_view_albums:false,can_download:false,show_ads:false,access_expires_at:null}]);
          const standard = normalizeBillingAccess([{tier:'standard',can_view_albums:true,can_download:false,show_ads:true,access_expires_at:future}]);
          const vip = normalizeBillingAccess([{tier:'vip',can_view_albums:true,can_download:true,show_ads:false,access_expires_at:future}]);
          assert.equal(free.canDownload,false);
          assert.equal(standard.showAds,true);
          assert.equal(vip.canDownload,true);
          assert.equal(resolveMemberPresentation({role:'admin'},free).isAdmin,true);
          assert.equal(resolveMemberPresentation({account_type:'vip',vip_until:future},free).canDownload,true);
          assert.equal(resolveMemberPresentation({account_type:'standard'},standard).tier,'standard');
          assert.equal(resolveMemberPresentation({account_type:'standard'},vip).tier,'vip');
          assert.throws(()=>normalizeBillingAccess([{tier:'vip',can_view_albums:true,can_download:true,show_ads:false,access_expires_at:past}]));
          assert.throws(()=>normalizeBillingAccess([{tier:'vip',can_view_albums:true,can_download:true,show_ads:true,access_expires_at:future}]));
          assert.throws(()=>normalizeBillingAccess([]));
          const home = readFileSync('src/pages/public/Home.jsx','utf8');
          const layout = readFileSync('src/components/layout/MainLayout.jsx','utf8');
          const player = readFileSync('src/components/VIPVideoPlayer.jsx','utf8');
          assert.match(home,/getBillingAccess\(\)/);
          assert.match(home,/membership\.canDownload/);
          assert.match(home,/to="\/subscribe"/);
          assert.match(home,/onClick=\{\(\) => setShowRedeemModal\(true\)\}/);
          assert.match(home,/Redeem Code/);
          assert.match(layout,/getBillingAccess\(\)/);
          assert.match(player,/typeof isAdFreeProp === "boolean"/);
          console.log('PASS: membership entitlement parsing and integration checks');
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
