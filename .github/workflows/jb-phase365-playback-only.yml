name: Phase 365 Playback-Only Legacy Ticket Client

on:
  pull_request:
    paths:
      - 'src/services/privateMedia.js'
      - 'scripts/tests/test-phase365-playback-only-client.mjs'
      - '.github/workflows/jb-phase365-playback-only.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/tests/test-phase365-playback-only-client.mjs
      - run: node --check src/services/privateMedia.js
      - run: npm run build
