name: JB Phase 348 Admin Album Creation (NO DEPLOY)

on:
  pull_request:
    paths:
      - 'src/components/admin/AdminPrivateAlbumUpload.jsx'
      - 'scripts/tests/test-phase348-create-admin-album.mjs'
      - '.github/workflows/jb-phase348-admin-create-albums.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  album-creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Admin album creation security and UI tests
        run: node --test scripts/tests/test-phase348-create-admin-album.mjs
      - name: Existing media and R2 regressions
        run: |
          node --test scripts/tests/test-phase341-media-management.mjs
          node --test scripts/tests/test-phase347-r2-automatic-cleanup.mjs
      - name: Production Vite build
        run: npm run build
