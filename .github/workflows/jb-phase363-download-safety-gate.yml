name: Phase 363 Independent Safety Clearance Gate (Offline)

on:
  pull_request:
    paths:
      - 'api/jb-branded-download.js'
      - 'supabase/migrations/20261124070000_jb_download_safety_clearance_v1.sql'
      - 'scripts/tests/test-phase363-download-safety-gate.mjs'
      - '.github/workflows/jb-phase363-download-safety-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no production access)
        run: npm ci
      - name: Verify fail-closed release gates
        run: node --test scripts/tests/test-phase363-download-safety-gate.mjs
      - name: API syntax check
        run: node --check api/jb-branded-download.js
      - name: Build frontend
        run: npm run build
